apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Primeiro provisiona a infraestrutura, sem iniciar a aplicação.
# Use apenas na preparação inicial; reduz a zero os Deployments existentes.
resources:
  - ../k8s

replicas:
  - name: backend
    count: 0
  - name: frontend
    count: 0
  - name: worker
    count: 0
